name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs test and package the app as a workflow artifact without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: make test

      - name: Package
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/package.sh "$VERSION"
          lipo -archs build/Paneless.app/Contents/MacOS/Paneless
          codesign --verify --deep --strict build/Paneless.app

      - uses: actions/upload-artifact@v7
        with:
          name: Paneless-${{ env.VERSION }}
          path: build/Paneless.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Paneless.zip \
            --title "Paneless ${VERSION}" \
            --notes-file build/release-notes.md \
            --generate-notes
